<script>
'use strict';
/* ============================================================
   CBT SEKOLAH — JavaScript (SPA). Prinsip GAS Instant UX:
   1) Navigasi 100% client-side (tanpa google.script.run untuk pindah halaman)
   2) Optimistic UI + localStorage (jawaban ujian aman walau koneksi putus)
   3) Satu panggilan getBootstrap memuat semua data awal; filter/cari lokal
   4) Sinkronisasi latar belakang (debounce) & batch di backend
   ============================================================ */

// ── State global ──
const S = { token: null, user: null, d: null, view: null, entered: false, offset: 0, charts: {}, ex: null,
  uf: 'Semua', pf: { tab: 'semua', q: '', mapel: '' }, gTab: 'ringkasan', kTab: 'Materi', uTab: 'siswa',
  rekap: { q: '', kelas: '', mapel: '', jenis: '', page: 1 }, bank: { q: '', mapel: '', page: 1 },
  pengguna: { q: '', page: 1 }, tokJ: null, pantauTimer: null };

// ── Helper ringkas ──
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDT = ms => ms ? new Date(+ms).toLocaleString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-';
const fmtD = ms => ms ? new Date(+ms).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const initials = n => (String(n || '?').replace(/[^\p{L}\s]/gu, '').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('') || 'U').toUpperCase();
const num = n => (n == null || isNaN(n)) ? '-' : String(Math.round(n * 10) / 10).replace('.', ',');
const tingkat = k => (String(k || '').match(/^\s*(\d+)/) || [])[1] || '';
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
const nowS = () => Date.now() + S.offset;
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* penyimpanan penuh/diblokir */ } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { /* abaikan */ } };
const jparse = (s, d) => { try { return JSON.parse(s); } catch (e) { return d; } };
const empty = (ico, msg) => `<div class="empty"><i class="bi bi-${ico}"></i><p class="mb-0">${esc(msg)}</p></div>`;
const skeleton = n => Array.from({ length: n }, () => '<div class="skeleton mb-3" style="height:84px"></div>').join('');

// ── Panggilan backend (Promise) ──
function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(r => {
        if (r && r.success === false) {
          if (r.code === 'SESSION') sesiHabis(r.message);
          const e = new Error(r.message); e.code = r.code; reject(e);
        } else resolve(r ? r.data : null);
      })
      .withFailureHandler(e => reject(new Error((e && e.message) || 'Koneksi bermasalah.')))[fn](...args);
  });
}
const A = (fn, ...args) => api(fn, S.token, ...args);

// ── UI util: toast, modal, tombol sibuk ──
function toast(msg, type = 'success') {
  const ico = { success: 'check-circle-fill', danger: 'x-circle-fill', warning: 'exclamation-triangle-fill', info: 'info-circle-fill' }[type] || 'info-circle-fill';
  const el = document.createElement('div');
  el.className = 'toast-cb ' + type; el.setAttribute('role', type === 'danger' ? 'alert' : 'status');
  el.innerHTML = `<i class="bi bi-${ico}"></i><div>${esc(msg)}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), type === 'danger' ? 6000 : 3500);
}
const M = id => bootstrap.Modal.getOrCreateInstance(document.getElementById(id));
function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner-cb"></span> ' + (label || 'Memproses...'); }
  else { btn.disabled = false; if (btn.dataset.html) btn.innerHTML = btn.dataset.html; }
}
function confirmDlg(html, onYes, label) {
  $('#confirmBody').innerHTML = html;
  const b = $('#btnConfirmYes'); b.textContent = label || 'Ya, lanjutkan';
  b.onclick = async () => { M('mdlConfirm').hide(); await onYes(); };
  M('mdlConfirm').show();
}
/** Modal formulir dinamis. onSave boleh async; kembalikan false untuk menahan modal. */
function dyn(title, body, onSave, opt = {}) {
  $('#dynT').textContent = title; $('#dynBody').innerHTML = body;
  const b = $('#dynSave'); b.innerHTML = opt.label || '<i class="bi bi-check2"></i> Simpan'; b.disabled = false; b.hidden = !!opt.noSave;
  b.onclick = async () => {
    busy(b, true, opt.busy || 'Menyimpan...');
    try { const r = await onSave(); if (r !== false) M('mdlDyn').hide(); }
    catch (e) { toast(e.message, 'danger'); }
    finally { busy(b, false); }
  };
  M('mdlDyn').show();
}

// ── Tema terang/gelap ──
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t); document.documentElement.setAttribute('data-bs-theme', t);
  $('#themeIco').className = 'bi bi-' + (t === 'dark' ? 'sun' : 'moon-stars'); lsSet('cbt_theme', t);
  Object.values(S.charts).forEach(c => { try { c.destroy(); } catch (e) { /* abaikan */ } }); S.charts = {};
  if (S.entered && !S.ex) renderView(S.view, true);
}
const toggleTheme = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
const chartColors = () => { const d = document.documentElement.getAttribute('data-theme') === 'dark'; return { text: d ? '#E6EDF7' : '#1E293B', grid: d ? '#25324A' : '#E2E8F0' }; };

// ════════════════════════════════════════════════════════
// AUTENTIKASI & BOOT
// ════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', init);

async function init() {
  setTheme(lsGet('cbt_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('#ftYear').textContent = new Date().getFullYear();
  bindGlobal();
  const t = lsGet('cbt_token');
  if (!t) return showLogin();
  S.token = t;
  const cached = jparse(lsGet('cbt_boot'), null);
  if (cached && cached.user && cached.user.id) { // tampil instan dari cache lokal, lalu segarkan di latar belakang
    S.d = cached; S.user = cached.user; enterApp(); refresh().catch(() => { });
  } else { try { await refresh(); } catch (e) { showLogin(); } }
}

function showLogin() {
  $('#boot').hidden = true; $('#app').hidden = true; $('#vLogin').hidden = false; S.entered = false; $('#inUser').focus();
}

function sesiHabis(msg) {
  if (!S.token) return;
  S.token = null; lsDel('cbt_token'); lsDel('cbt_boot'); cleanupExam();
  showLogin(); if (msg) toast(msg, 'warning');
}

async function refresh() {
  const d = await A('getBootstrap');
  S.d = d; S.user = d.user; S.offset = d.now - Date.now();
  try { const s = JSON.stringify(d); if (s.length < 2000000) lsSet('cbt_boot', s); } catch (e) { /* abaikan */ }
  if (!S.entered) enterApp(); else { applyConfig(); if (!S.ex) renderView(S.view, true); }
}

function enterApp() {
  $('#boot').hidden = true; $('#vLogin').hidden = true; $('#app').hidden = false; S.entered = true;
  applyConfig(); buildNav();
  go(S.user.peran === 'siswa' ? 'dash' : 'guru');
}

function applyConfig() {
  const c = S.d.cfg, u = S.user;
  $('#schoolName').textContent = c.namaSekolah; $('#ftSchool').textContent = c.namaSekolah; $('#loginTitle').textContent = 'CBT Sekolah';
  $('#meName').textContent = u.nama; $('#meAv').textContent = initials(u.nama);
  $('#meSub').innerHTML = (u.peran === 'siswa' ? 'Kls ' + esc(u.kelas) : u.peran === 'admin' ? 'Admin' : 'Guru') + ' • <span class="online">ONLINE</span>';
  const lg = $('#brandLogo');
  if (c.logoUrl && /^https?:\/\//i.test(c.logoUrl)) lg.innerHTML = `<img src="${esc(c.logoUrl)}" alt="Logo sekolah">`; else lg.innerHTML = '<i class="bi bi-mortarboard-fill"></i>';
  const live = u.peran === 'siswa' ? (S.d.jadwal || []).filter(j => statusUjian(j).k === 'buka' || statusUjian(j).k === 'lanjut').length : 0;
  const dot = $('#bellDot'); dot.hidden = !live; dot.textContent = live;
}

function buildNav() {
  const siswa = S.user.peran === 'siswa';
  const items = siswa
    ? [['dash', 'Dashboard Siswa', 'house-door'], ['ujian', 'Ruang Ujian', 'pencil-square'], ['portal', 'Portal Belajar & Game', 'controller'], ['nilai', 'Nilai Saya', 'bar-chart']]
    : [['guru', 'Panel ' + (S.user.peran === 'admin' ? 'Admin' : 'Guru'), 'speedometer2'], ['portal', 'Portal Belajar & Game', 'controller']];
  $('#navCb').innerHTML = items.filter(i => i[0] !== 'nilai').map(i => `<button data-nav="${i[0]}"><i class="bi bi-${i[2]}"></i>${esc(i[1])}</button>`).join('');
  $('#bottomNav').innerHTML = items.map(i => `<button data-nav="${i[0]}" aria-label="${esc(i[1])}"><i class="bi bi-${i[2]}"></i><span>${esc(i[1].replace('Portal Belajar & Game', 'Belajar').replace('Dashboard Siswa', 'Beranda').replace('Ruang Ujian', 'Ujian').replace('Panel ', ''))}</span></button>`).join('');
  $('#bellDot').parentElement.hidden = !siswa;
}

async function doLogin(ev) {
  ev.preventDefault();
  const u = $('#inUser').value.trim(), p = $('#inPass').value, err = $('#loginErr'); err.hidden = true;
  if (!u || !p) { err.textContent = 'Username dan password wajib diisi.'; err.hidden = false; return; }
  const b = $('#btnLogin'); busy(b, true, 'Masuk...');
  try {
    const r = await api('login', u, p);
    S.token = r.token; lsSet('cbt_token', r.token); $('#inPass').value = '';
    $('#boot').hidden = false; await refresh();
  } catch (e) { $('#boot').hidden = true; err.textContent = e.message; err.hidden = false; }
  finally { busy(b, false); }
}

function doLogout() {
  const t = S.token; cleanupExam();
  S.token = null; lsDel('cbt_token'); lsDel('cbt_boot'); S.d = null; S.entered = false;
  if (t) google.script.run.logout(t); // fire & forget
  showLogin();
}

// ════════════════════════════════════════════════════════
// NAVIGASI SPA (tanpa reload, URL tidak berubah)
// ════════════════════════════════════════════════════════
function go(v) {
  if (S.ex && v !== 'ruang') { toast('Selesaikan atau kumpulkan ujian terlebih dahulu.', 'warning'); return; }
  clearInterval(S.pantauTimer);
  S.view = v;
  $$('.view').forEach(x => x.classList.remove('active'));
  const el = { dash: '#vDash', ujian: '#vUjian', ruang: '#vRuang', nilai: '#vNilai', portal: '#vPortal', guru: '#vGuru' }[v];
  $(el).classList.add('active');
  $$('[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === v || (v === 'ruang' && b.dataset.nav === 'ujian')));
  renderView(v); window.scrollTo({ top: 0 });
}
function renderView(v, keep) {
  if (v === 'dash') renderDash(); else if (v === 'ujian') renderUjian(); else if (v === 'nilai') renderNilai();
  else if (v === 'portal') renderPortal(keep); else if (v === 'guru') renderGuru(keep);
}

// ── Delegasi event global ──
function bindGlobal() {
  $('#fLogin').addEventListener('submit', doLogin);
  $('#btnEye').addEventListener('click', () => { const i = $('#inPass'); i.type = i.type === 'password' ? 'text' : 'password'; $('#btnEye i').className = 'bi bi-eye' + (i.type === 'text' ? '-slash' : ''); });
  document.addEventListener('click', e => {
    const n = e.target.closest('[data-nav]'); if (n) { go(n.dataset.nav); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const f = ACT[a.dataset.act]; if (f) f(a, e);
  });
  document.addEventListener('input', e => { const f = INP[e.target.dataset && e.target.dataset.inp]; if (f) f(e.target); });
  document.addEventListener('change', e => { const f = INP[e.target.dataset && e.target.dataset.inp]; if (f) f(e.target); });
  window.addEventListener('online', () => { $('#netState').textContent = 'Server Aktif'; if (S.ex) syncNow(); });
  window.addEventListener('offline', () => { $('#netState').textContent = 'Offline — data tersimpan di perangkat'; setSync(false); });
  $('#inToken').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnMulai').click(); });
  $('#btnMulai').addEventListener('click', () => startExam(S.tokJ, $('#inToken').value, $('#btnMulai')));
}

const ACT = {
  home: () => go(S.user.peran === 'siswa' ? 'dash' : 'guru'),
  theme: toggleTheme,
  logout: () => confirmDlg('Yakin ingin keluar dari aplikasi?', doLogout, 'Keluar'),
  bell: () => { if (S.user.peran === 'siswa') go('ujian'); },
  pass: () => formPass(),
  'hasil-ok': () => { M('mdlHasil').hide(); go('dash'); refresh().catch(() => { }); },
  'mulai-card': (el) => openToken(el.dataset.id),
  'lanjut': (el) => startExam(el.dataset.id, '', el),
  'mulai-hero': (el) => startExam(el.dataset.id, ($('#inHeroToken') || {}).value || '', el),
  'lihat-nilai': () => go('nilai'),
  uf: (el) => { S.uf = el.dataset.v; renderUjian(); },
  portal: (el) => { S.pf.tab = el.dataset.v; go('portal'); },
  pf: (el) => { S.pf.tab = el.dataset.v; renderPortal(); },
  play: (el) => openGame(el.dataset.id),
  video: (el) => openMedia('video', el.dataset.id),
  materi: (el) => openMedia('materi', el.dataset.id)
};
const INP = {
  pq: (el) => { S.pf.q = el.value; renderPortalList(); },
  pm: (el) => { S.pf.mapel = el.value; renderPortalList(); }
};

// ════════════════════════════════════════════════════════
// SISWA: DASHBOARD
// ════════════════════════════════════════════════════════
function statusUjian(j) {
  const n = nowS();
  if (j.saya === 'Selesai') return { k: 'selesai', t: 'Selesai', c: 'blue' };
  if (j.saya === 'Berlangsung') return { k: 'lanjut', t: 'Sedang Berlangsung', c: 'green' };
  if (j.status === 'Ditutup' || n > j.selesai) return { k: 'tutup', t: 'Berakhir', c: 'red' };
  if (n < j.mulai) return { k: 'belum', t: 'Belum Dibuka', c: '' };
  return { k: 'buka', t: 'Dibuka', c: 'green' };
}
const sapaan = () => { const h = new Date().getHours(); return h < 11 ? 'Pagi' : h < 15 ? 'Siang' : h < 18 ? 'Sore' : 'Malam'; };
const warnaJenis = j => ({ PTS: '#0F2A6B', PAS: '#7C3AED', PAT: '#F97316', TKA: '#10B981', UN: '#DC2626', Harian: '#0EA5E9' }[j] || '#64748B');

function renderDash() {
  const d = S.d, u = S.user, kkm = +d.cfg.kkm || 75;
  const jad = (d.jadwal || []).map(j => Object.assign({ st: statusUjian(j) }, j));
  const aktif = jad.find(j => j.st.k === 'lanjut') || jad.find(j => j.st.k === 'buka');
  const siap = jad.filter(j => j.st.k === 'buka' || j.st.k === 'lanjut').length;
  const hasil = (d.hasil || []).slice().sort((a, b) => b.waktu - a.waktu);
  const rata = hasil.filter(h => h.nilai != null).length ? hasil.reduce((s, h) => s + (h.nilai || 0), 0) / hasil.filter(h => h.nilai != null).length : null;
  const nextUp = jad.filter(j => j.st.k === 'belum' || j.st.k === 'buka' || j.st.k === 'lanjut').sort((a, b) => a.mulai - b.mulai).slice(0, 5);
  let hero;
  if (aktif) {
    const resume = aktif.st.k === 'lanjut';
    hero = `<div class="hero-exam"><div>
      <span class="live-pill"><span class="live-dot"></span>${resume ? 'UJIAN BELUM DIKUMPULKAN' : 'ASESMEN SEDANG BERLANGSUNG'}</span>
      <h2>${esc(aktif.mapel)}</h2><p class="sub mb-0">${esc(aktif.judul)} • Kelas ${esc(u.kelas)}</p>
      <div class="facts"><div class="fact"><small>Durasi</small><b>${aktif.durasi} Menit</b></div><div class="fact"><small>Beban Soal</small><b>${aktif.jumlah} Soal</b></div><div class="fact"><small>Jenis</small><b>${esc(aktif.jenis)}</b></div></div>
      <div class="fact mt-3" style="width:fit-content"><i class="bi bi-shield-check me-1"></i>Jangan berpindah jendela browser saat ujian berjalan.</div></div>
      <div class="token-card"><div class="d-flex justify-content-between mb-1"><b>Kunci Akses Ujian</b><span class="badge-pill green"><i class="bi bi-unlock"></i> Siap</span></div>
      ${resume ? '<p class="muted small mb-3">Kamu sudah memulai ujian ini. Lanjutkan dari jawaban terakhir.</p>'
        : '<p class="muted small">Minta token 6 digit kepada pengawas ujian di ruang kelasmu.</p><label class="visually-hidden-cb" for="inHeroToken">Token</label><input id="inHeroToken" class="form-control mb-3" maxlength="12" autocomplete="off" placeholder="TOKEN">'}
      <button class="btn-cb amber lg block" data-act="mulai-hero" data-id="${esc(aktif.id)}"><i class="bi bi-play-fill"></i> ${resume ? 'Lanjutkan Ujian' : 'Mulai Kerjakan Ujian'}</button></div></div>`;
  } else {
    hero = `<div class="card-cb mt-4 text-center">${empty('emoji-smile', 'Belum ada ujian yang berlangsung. Gunakan waktumu untuk belajar atau bermain game edukasi!')}</div>`;
  }
  $('#vDash').innerHTML = `
    <div class="greet"><span class="avatar">${esc(initials(u.nama))}</span>
      <div class="greet-text"><h1 class="h-xl">Selamat ${sapaan()}, ${esc(u.nama.split(' ')[0])}!</h1>
      <p class="muted mb-0">${siap ? `Ada ${siap} ujian yang siap kamu kerjakan.` : 'Tetap semangat belajar hari ini.'}</p></div>
      <div class="mini-stats"><div class="mini-stat"><b>${hasil.length}</b><small>Ujian Selesai</small></div>
      <div class="mini-stat"><b>${rata == null ? '-' : num(rata)}</b><small>Rata-rata Nilai</small></div>
      <div class="mini-stat"><b style="color:var(--amber)">${(d.xp || 0).toLocaleString('id-ID')}</b><small>Poin Bintang</small></div></div></div>
    ${hero}
    <div class="sec-title"><div><div class="eyebrow">Jelajahi portal</div><h2 class="h-lg">Menu Belajar Siswa</h2></div></div>
    <div class="menu-grid">
      <button class="menu-card" data-nav="ujian"><span class="ico" style="background:var(--primary)"><i class="bi bi-clipboard-check"></i></span><h3>Ujian Digital CBT</h3><p>Akses ujian harian, PTS, PAS, PAT, TKA, dan UN secara daring.</p><span class="go"><b>Buka Jadwal Ujian</b><span class="badge-pill orange">${siap} ujian siap</span></span></button>
      <button class="menu-card" data-act="portal" data-v="Materi"><span class="ico" style="background:#6366F1"><i class="bi bi-journal-bookmark"></i></span><h3>Materi Pelajaran</h3><p>Modul dan ringkasan materi dari guru untuk kelasmu.</p><span class="go"><b>Baca Modul</b><span class="badge-pill blue">${d.materi.length} materi</span></span></button>
      <button class="menu-card" data-act="portal" data-v="Video"><span class="ico" style="background:var(--orange)"><i class="bi bi-play-btn"></i></span><h3>Video Edukasi</h3><p>Penjelasan visual dari guru dan sumber pembelajaran lain.</p><span class="go"><b>Tonton Sekarang</b><span class="badge-pill orange">${d.video.length} video</span></span></button>
      <button class="menu-card" data-act="portal" data-v="Game"><span class="ico" style="background:var(--green)"><i class="bi bi-controller"></i></span><h3>Game Cerdas Cermat</h3><p>Asah kemampuan sambil bermain dan kumpulkan poin bintang!</p><span class="go"><b>Mulai Bermain</b><span class="badge-pill green">${d.game.length} game</span></span></button>
    </div>
    <div class="two-col">
      <div class="card-cb"><div class="eyebrow">Prestasi akademik</div><h2 class="h-md mb-3">Hasil Ujian Terbaru</h2>
        ${hasil.length ? hasil.slice(0, 3).map(h => `<div class="score-row"><span class="grade">${esc(h.predikat || '-')}</span><div><b>${esc(h.mapel)}</b><div class="small-x muted">${esc(h.judul)}</div><span class="badge-pill ${h.nilai >= kkm ? 'green' : 'red'} mt-1">KKM ${kkm} • ${h.nilai == null ? 'Menunggu' : h.nilai >= kkm ? 'Tuntas' : 'Remedial'}</span></div><div class="num">${h.nilai == null ? '-' : num(h.nilai)}<small>Skor / 100</small></div></div>`).join('') : empty('journal-text', 'Belum ada hasil ujian.')}
        <button class="btn-cb soft block mt-2" data-act="lihat-nilai"><i class="bi bi-bar-chart"></i> Lihat Semua Hasil</button></div>
      <div class="card-cb"><div class="eyebrow">Agenda siswa</div><h2 class="h-md mb-3">Jadwal Ujian Mendatang</h2>
        ${nextUp.length ? nextUp.map(j => `<div class="agenda ${j.st.k !== 'belum' ? 'now' : ''}"><div class="d-flex justify-content-between"><small>${esc(fmtDT(j.mulai))}</small>${j.st.k !== 'belum' ? '<span class="badge-pill amber">Aktif</span>' : ''}</div><b>${esc(j.mapel)}</b><small>${esc(j.judul)} • ${j.durasi} menit</small></div>`).join('') : empty('calendar-check', 'Tidak ada jadwal mendatang.')}
      </div></div>
    <div class="tip-bar"><span class="avatar"><i class="bi bi-lightbulb"></i></span><div class="flex-grow-1"><b>Tips ujian santai & konsentrasi</b><div class="small muted">1. Berdoa sebelum mulai • 2. Baca soal dengan teliti • 3. Gunakan tombol "Tandai Ragu-Ragu" jika belum yakin.</div></div></div>`;
}

// ════════════════════════════════════════════════════════
// SISWA: DAFTAR UJIAN, TOKEN
// ════════════════════════════════════════════════════════
function renderUjian() {
  const jenis = ['Semua', 'PTS', 'PAS', 'PAT', 'TKA', 'UN', 'Harian'];
  const list = (S.d.jadwal || []).filter(j => S.uf === 'Semua' || j.jenis === S.uf).sort((a, b) => b.mulai - a.mulai);

    <div class="tabs-cb mb-4" role="tablist">${jenis.map(j => `<button role="tab" data-act="uf" data-v="${j}" class="${S.uf === j ? 'active' : ''}">${j}</button>`).join('')}</div>
    ${list.length ? `<div class="exam-grid">${list.map(j => { const st = statusUjian(j);
      const btn = st.k === 'buka' ? `<button class="btn-cb amber block" data-act="mulai-card" data-id="${esc(j.id)}"><i class="bi bi-play-fill"></i> Mulai</button>`
        : st.k === 'lanjut' ? `<button class="btn-cb primary block" data-act="lanjut" data-id="${esc(j.id)}"><i class="bi bi-arrow-repeat"></i> Lanjutkan</button>`
        : st.k === 'selesai' ? '<button class="btn-cb soft block" data-act="lihat-nilai"><i class="bi bi-bar-chart"></i> Lihat Nilai</button>'
        : `<button class="btn-cb ghost block" disabled>${st.k === 'belum' ? 'Belum dibuka' : 'Waktu berakhir'}</button>`;
      return `<article class="exam-card"><div class="strip" style="background:${warnaJenis(j.jenis)}"></div><div class="body"><div class="d-flex justify-content-between align-items-start gap-2"><h3 class="h-sm">${esc(j.mapel)}</h3><span class="badge-pill ${st.c}">${st.t}</span></div>
        <div class="muted small">${esc(j.judul)}</div><div class="meta"><span><i class="bi bi-tag"></i>${esc(j.jenis)}</span><span><i class="bi bi-clock"></i>${j.durasi} menit</span><span><i class="bi bi-list-check"></i>${j.jumlah} soal</span></div>
        <div class="meta"><span><i class="bi bi-calendar-event"></i>${esc(fmtDT(j.mulai))}</span></div><div class="mt-auto pt-2">${btn}</div></div></article>`; }).join('')}</div>` : `<div class="card-cb">${empty('inbox', 'Belum ada ujian untuk pilihan ini.')}</div>`}`;
}

function openToken(id) {
  const j = S.d.jadwal.find(x => x.id === id); if (!j) return;
  S.tokJ = id; $('#tokenInfo').textContent = `${j.mapel} — ${j.judul}. Minta token kepada pengawas ujian.`;
  $('#inToken').value = ''; $('#tokenErr').hidden = true; M('mdlToken').show();
  setTimeout(() => $('#inToken').focus(), 400);
}

async function startExam(id, token, btn) {
  if (!id) return;
  const mt = document.getElementById('mdlToken').classList.contains('show');
  busy(btn, true, 'Menyiapkan soal...');
  try {
    const r = await A('mulaiUjian', id, token);
    if (mt) M('mdlToken').hide();
    beginExam(r);
  } catch (e) {
    if (mt) { $('#tokenErr').textContent = e.message; $('#tokenErr').hidden = false; } else toast(e.message, 'danger');
  } finally { busy(btn, false); }
}

// ════════════════════════════════════════════════════════
// SISWA: RUANG PENGERJAAN UJIAN (optimistic + autosave)
// ════════════════════════════════════════════════════════
function beginExam(r) {
  const local = jparse(lsGet('cbt_ex_' + r.attemptId), null);
  const ans = Object.assign({}, r.jawaban || {}, local ? local.ans : {});
  const ragu = new Set(local ? local.ragu : (r.ragu || []));
  S.offset = r.now - Date.now();
  S.ex = Object.assign({}, r, { cur: 0, ans: ans, ragu: ragu, viol: local ? (local.viol || 0) : 0, dirty: !!local, saveT: null, tick: null, auto: null, lastOk: null, submitting: false });
  window.addEventListener('beforeunload', guardUnload);
  document.addEventListener('visibilitychange', onVis);
  S.ex.tick = setInterval(tick, 1000); S.ex.auto = setInterval(() => { if (S.ex && S.ex.dirty) syncNow(); }, 12000);
  buildRuang(); go('ruang'); tick();
  if (S.ex.dirty) syncNow();
}
const guardUnload = e => { if (S.ex) { e.preventDefault(); e.returnValue = ''; } };
function onVis() { if (S.ex && document.hidden) { S.ex.viol++; saveLocal(); S.ex.dirty = true; toast('Terdeteksi berpindah tab. Tetap fokus pada ujian ya!', 'warning'); } }
function cleanupExam() {
  if (S.ex) { clearInterval(S.ex.tick); clearInterval(S.ex.auto); clearTimeout(S.ex.saveT); }
  S.ex = null; window.removeEventListener('beforeunload', guardUnload); document.removeEventListener('visibilitychange', onVis);
}
function saveLocal() { const e = S.ex; if (e) lsSet('cbt_ex_' + e.attemptId, JSON.stringify({ ans: e.ans, ragu: Array.from(e.ragu), viol: e.viol, t: Date.now() })); }
function setSync(ok, t) {
  const el = $('#syncLine'); if (!el) return;
  el.className = 'sync-line' + (ok ? '' : ' off');
  el.innerHTML = ok ? `<i class="bi bi-cloud-check"></i> Tersimpan otomatis ke Google Sheets${t ? ' (' + new Date(t).toLocaleTimeString('id-ID') + ')' : ''}` : '<i class="bi bi-cloud-slash"></i> Menunggu koneksi — jawaban aman di perangkat';
}
async function syncNow() {
  const e = S.ex; if (!e || e.submitting) return;
  clearTimeout(e.saveT);
  const snap = { ans: JSON.parse(JSON.stringify(e.ans)), ragu: Array.from(e.ragu), viol: e.viol };
  try {
    const r = await A('simpanJawaban', e.attemptId, snap.ans, snap.ragu, snap.viol);
    if (!S.ex) return;
    if (r.status === 'Selesai' || r.status === 'Habis') { autoSubmit('Waktu ujian berakhir. Jawabanmu dikumpulkan otomatis.'); return; }
    e.dirty = false; e.lastOk = r.saved; setSync(true, r.saved);
  } catch (err) { setSync(false); }
}
function queueSync() { const e = S.ex; clearTimeout(e.saveT); e.saveT = setTimeout(syncNow, 4000); }

function buildRuang() {
  const e = S.ex;
  $('#vRuang').innerHTML = `<div class="exam-head"><span class="ico"><i class="bi bi-flask"></i></span>
    <div><h1 class="h-lg">${esc(e.judul)}</h1><div id="syncLine" class="sync-line"></div></div>
    <div class="timer" id="timerBox" role="timer" aria-live="off"><i class="bi bi-stopwatch fs-4"></i><div><small>SISA WAKTU</small><b id="timerTxt">--:--:--</b></div></div></div>
    <div class="exam-layout"><div><div class="q-card" id="qCard"></div>
      <div class="q-actions"><button class="btn-cb ghost" data-act="q-prev"><i class="bi bi-arrow-left"></i> Sebelumnya</button>
        <button class="btn-cb btn-ragu" id="btnRagu" data-act="q-ragu"><i class="bi bi-flag"></i> Tandai Ragu-Ragu</button>
        <button class="btn-cb primary lg" data-act="q-next" id="btnNext">Simpan & Lanjut <i class="bi bi-arrow-right"></i></button></div>
      <div class="hint-box"><i class="bi bi-lightbulb me-1"></i><b>Petunjuk:</b> Baca setiap pilihan dengan teliti. Jika ragu, tekan tombol kuning "Tandai Ragu-Ragu" untuk meninjau kembali sebelum mengumpulkan.</div></div>
      <aside class="q-side"><div class="card-cb"><div class="d-flex justify-content-between align-items-center"><h2 class="h-sm"><i class="bi bi-grid-3x3-gap me-1"></i>Navigasi Butir Soal</h2><span class="badge-pill">${e.soal.length} soal</span></div>
        <div class="tally" id="tally"></div><div class="qgrid" id="qgrid"></div>
        <button class="btn-cb green lg block mt-3" data-act="q-finish"><i class="bi bi-check2-square"></i> Selesaikan & Kirim Ujian</button></div></aside></div>`;
  setSync(navigator.onLine !== false, e.lastOk); renderQ();
}

function renderQ() {
  const e = S.ex; if (!e) return;
  const q = e.soal[e.cur], a = e.ans[q.id];
  let h = `<div class="q-meta"><span class="q-no">Soal Nomor ${e.cur + 1} dari ${e.soal.length}</span>
    <span class="d-flex gap-2"><span class="badge-pill blue">${({ PG: 'Pilihan Ganda', PGK: 'Pilihan Ganda Kompleks', BS: 'Benar / Salah', Isian: 'Isian Singkat' })[q.tipe] || q.tipe}</span><span class="badge-pill amber"><i class="bi bi-trophy"></i> Bobot: ${num(q.bobot)} Poin</span></span></div>
    <div class="q-text">${esc(q.tanya)}</div>`;
  if (q.gambar && safeUrl(q.gambar) !== '#') h += `<img class="q-img" src="${esc(q.gambar)}" alt="Gambar pendukung soal nomor ${e.cur + 1}" loading="lazy">`;
  if (q.tautan && safeUrl(q.tautan) !== '#') h += `<p><a class="btn-cb soft sm" href="${esc(q.tautan)}" target="_blank" rel="noopener noreferrer"><i class="bi bi-link-45deg"></i> Buka media pendukung</a></p>`;
  if (q.tipe === 'PG' || q.tipe === 'PGK') {
    const multi = q.tipe === 'PGK'; const sel = multi ? (Array.isArray(a) ? a : []) : [a];
    if (multi) h += '<p class="muted small"><i class="bi bi-info-circle"></i> Pilih lebih dari satu jawaban yang benar.</p>';
    h += q.opsi.map((o, i) => `<button class="opt ${multi ? 'square' : ''} ${sel.includes(o.k) ? 'sel' : ''}" data-act="q-opt" data-k="${o.k}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${sel.includes(o.k)}"><span class="pre">${'ABCD'[i]}</span><span>${esc(o.t)}</span><span class="chk">${sel.includes(o.k) ? '<i class="bi bi-check-lg"></i>' : ''}</span></button>`).join('');
  } else if (q.tipe === 'BS') {
    h += ['Benar', 'Salah'].map((o, i) => `<button class="opt ${a === o ? 'sel' : ''}" data-act="q-opt" data-k="${o}" role="radio" aria-checked="${a === o}"><span class="pre"><i class="bi bi-${i ? 'x-lg' : 'check-lg'}"></i></span><span>${o}</span><span class="chk">${a === o ? '<i class="bi bi-check-lg"></i>' : ''}</span></button>`).join('');
  } else {
    h += `<label class="form-label" for="inFill">Tulis jawabanmu:</label><input id="inFill" class="form-control fill-input" data-inp="fill" maxlength="200" autocomplete="off" value="${esc(a || '')}" placeholder="Ketik jawaban di sini">`;
  }
  if (a !== undefined && a !== '' && !(Array.isArray(a) && !a.length)) h += '<div class="small mt-2" style="color:var(--green-ink)"><i class="bi bi-check-circle"></i> Jawaban Anda tersimpan</div>';
  $('#qCard').innerHTML = h;
  const r = $('#btnRagu'); r.classList.toggle('on', e.ragu.has(q.id)); r.innerHTML = `<i class="bi bi-flag${e.ragu.has(q.id) ? '-fill' : ''}"></i> ${e.ragu.has(q.id) ? 'Batalkan Ragu-Ragu' : 'Tandai Ragu-Ragu'}`;
  $('#btnNext').innerHTML = e.cur === e.soal.length - 1 ? 'Simpan <i class="bi bi-check2"></i>' : 'Simpan & Lanjut <i class="bi bi-arrow-right"></i>';
  renderGrid();
}
function isAnswered(e, q) { const a = e.ans[q.id]; return !(a === undefined || a === null || a === '' || (Array.isArray(a) && !a.length)); }
function renderGrid() {
  const e = S.ex; let done = 0, ragu = 0;
  const g = e.soal.map((q, i) => { const dn = isAnswered(e, q), rg = e.ragu.has(q.id); if (rg) ragu++; else if (dn) done++;
    return `<button class="qbtn ${rg ? 'doubt' : dn ? 'done' : ''} ${i === e.cur ? 'cur' : ''}" data-act="q-go" data-i="${i}" aria-label="Soal ${i + 1}${dn ? ', sudah dijawab' : ''}${rg ? ', ragu-ragu' : ''}" ${i === e.cur ? 'aria-current="true"' : ''}>${i + 1}</button>`; }).join('');
  $('#qgrid').innerHTML = g;
  $('#tally').innerHTML = `<div><b style="color:var(--green-ink)">${done}</b>Sudah</div><div><b style="color:var(--amber)">${ragu}</b>Ragu</div><div><b>${e.soal.length - done - ragu}</b>Belum</div>`;
}
function answerChanged() { const e = S.ex; e.dirty = true; saveLocal(); setSync(false); queueSync(); }

Object.assign(ACT, {
  'q-opt': (el) => {
    const e = S.ex, q = e.soal[e.cur], k = el.dataset.k;
    if (q.tipe === 'PGK') { const a = Array.isArray(e.ans[q.id]) ? e.ans[q.id].slice() : []; const i = a.indexOf(k); if (i >= 0) a.splice(i, 1); else a.push(k); e.ans[q.id] = a.sort(); }
    else e.ans[q.id] = k;
    answerChanged(); renderQ(); // UI instan, sinkron di latar belakang
  },
  'q-go': (el) => { S.ex.cur = +el.dataset.i; syncNow(); renderQ(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  'q-prev': () => { const e = S.ex; if (e.cur > 0) { e.cur--; renderQ(); } },
  'q-next': () => { const e = S.ex; if (e.dirty) syncNow(); if (e.cur < e.soal.length - 1) { e.cur++; renderQ(); window.scrollTo({ top: 0, behavior: 'smooth' }); } else { toast('Jawaban tersimpan. Tekan "Selesaikan & Kirim Ujian" jika sudah selesai.', 'info'); } },
  'q-ragu': () => { const e = S.ex, id = e.soal[e.cur].id; if (e.ragu.has(id)) e.ragu.delete(id); else e.ragu.add(id); answerChanged(); renderQ(); },
  'q-finish': () => openSubmit()
});
INP.fill = (el) => { const e = S.ex; if (!e) return; e.ans[e.soal[e.cur].id] = el.value; answerChanged(); renderGrid(); };

function tick() {
  const e = S.ex; if (!e) return;
  const left = e.deadline - nowS(), s = Math.max(0, Math.floor(left / 1000));
  $('#timerTxt').textContent = [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(x => String(x).padStart(2, '0')).join(':');
  $('#timerBox').classList.toggle('urgent', left < 300000);
  if (left <= 0 && !e.submitting) autoSubmit('Waktu habis. Jawabanmu dikumpulkan otomatis.');
}

function openSubmit() {
  const e = S.ex; let done = 0, ragu = 0;
  e.soal.forEach(q => { if (e.ragu.has(q.id)) ragu++; else if (isAnswered(e, q)) done++; });
  const kosong = e.soal.length - done - ragu;
  $('#submitTally').innerHTML = `<div><b style="color:var(--green-ink)">${done}</b>Terjawab</div><div><b style="color:var(--amber)">${ragu}</b>Ragu-ragu</div><div><b>${kosong}</b>Belum dijawab</div>`;
  const w = $('#submitWarn'); w.hidden = !(kosong || ragu); w.textContent = kosong ? `Masih ada ${kosong} soal belum dijawab.` : `Ada ${ragu} soal yang kamu tandai ragu-ragu.`;
  $('#btnKumpul').onclick = () => { M('mdlSubmit').hide(); submitExam(); };
  M('mdlSubmit').show();
}
function autoSubmit(msg) { if (!S.ex || S.ex.submitting) return; toast(msg, 'warning'); submitExam(); }

async function submitExam() {
  const e = S.ex; if (!e || e.submitting) return;
  e.submitting = true; clearInterval(e.tick); clearInterval(e.auto); clearTimeout(e.saveT);
  $('#boot').hidden = false; $('#boot p').textContent = 'Mengumpulkan jawaban...';
  try {
    const r = await A('kumpulkanUjian', e.attemptId, e.ans, Array.from(e.ragu));
    lsDel('cbt_ex_' + e.attemptId); cleanupExam(); $('#boot').hidden = true; showHasil(r);
  } catch (err) {
    $('#boot').hidden = true; e.submitting = false;
    e.tick = setInterval(tick, 1000); e.auto = setInterval(() => { if (S.ex && S.ex.dirty) syncNow(); }, 12000);
    toast('Gagal mengumpulkan: ' + err.message + ' Jawabanmu aman di perangkat, coba lagi.', 'danger');
  }
}
function showHasil(r) {
  const kkm = +S.d.cfg.kkm || 75;
  $('#hasilBody').innerHTML = r.tampil
    ? `<div class="result-score" style="color:${r.nilai >= kkm ? 'var(--green-ink)' : 'var(--orange)'}">${num(r.nilai)}</div><div class="muted mb-3">dari 100 • Predikat ${esc(r.predikat)}</div>
       <div class="tally"><div><b style="color:var(--green-ink)">${r.benar}</b>Benar</div><div><b style="color:var(--red)">${r.salah}</b>Salah</div><div><b>${r.kosong}</b>Kosong</div></div>
       <p class="mb-0 fw-semibold">${r.nilai >= kkm ? 'Hebat! Kamu tuntas. Pertahankan ya!' : 'Jangan menyerah! Pelajari lagi materinya dan coba perbaiki.'}</p>`
    : '<i class="bi bi-check-circle-fill" style="font-size:64px;color:var(--green)"></i><p class="mt-3 mb-0 fw-semibold">Jawabanmu sudah tersimpan dengan aman. Nilai akan diumumkan oleh gurumu.</p>';
  M('mdlHasil').show();
}

function renderNilai() {
  const kkm = +S.d.cfg.kkm || 75, hasil = (S.d.hasil || []).slice().sort((a, b) => b.waktu - a.waktu);
  $('#vNilai').innerHTML = `<div class="sec-title" style="margin-top:0"><span class="ico" style="background:var(--green-soft);color:var(--green-ink)"><i class="bi bi-bar-chart"></i></span><div><h1 class="h-lg">Nilai Saya</h1><div class="muted small">Riwayat hasil ujianmu. KKM ${kkm}.</div></div></div>

}
function drawChart(key, id, cfg) {
  const cv = document.getElementById(id); if (!cv || !window.Chart) return;
  if (S.charts[key]) { try { S.charts[key].destroy(); } catch (e) { /* abaikan */ } }
  const c = chartColors();
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false }, cfg.options || {});
  cfg.options.plugins = Object.assign({ legend: { labels: { color: c.text } } }, cfg.options.plugins || {});
  if (cfg.options.scales) Object.values(cfg.options.scales).forEach(s => { s.ticks = Object.assign({ color: c.text }, s.ticks || {}); s.grid = Object.assign({ color: c.grid }, s.grid || {}); });
  S.charts[key] = new Chart(cv, cfg);
}

function renderPortal(keep) {
  const d = S.d, tabs = [['semua', 'grid', 'Semua Konten'], ['Materi', 'journal-bookmark', 'Materi (PDF/PPT)'], ['Video', 'play-btn', 'Video Interaktif'], ['Game', 'controller', 'Game Edukasi & Peringkat']];
  if (!['semua', 'Materi', 'Video', 'Game'].includes(S.pf.tab)) S.pf.tab = 'semua';

  $('#vPortal').innerHTML = `<div class="portal-hero"><span class="avatar" style="background:rgba(255,255,255,.15)"><i class="bi bi-rocket-takeoff"></i></span>

    ${S.user.peran === 'siswa' ? `<div class="stats"><div><small>Kelas</small><b>${esc(S.user.kelas)}</b></div><div><small>Koin Pintar</small><b>${(d.xp || 0).toLocaleString('id-ID')} XP</b></div></div>` : ''}</div>
    <div class="tabs-cb mt-4" role="tablist">${tabs.map(t => `<button role="tab" data-act="pf" data-v="${t[0]}" class="${S.pf.tab === t[0] ? 'active' : ''}"><i class="bi bi-${t[1]}"></i>${t[2]}</button>`).join('')}</div>
    <div class="toolbar mt-3"><div class="search-box grow"><i class="bi bi-search"></i><label class="visually-hidden-cb" for="pq">Cari konten</label><input id="pq" class="form-control" data-inp="pq" placeholder="Cari judul materi, video, atau game..." value="${esc(S.pf.q)}"></div>
      <select class="form-select" style="width:auto" data-inp="pm" aria-label="Filter mata pelajaran"><option value="">Semua Mapel</option>${mapel.map(m => `<option ${S.pf.mapel === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
    <div id="pList"></div>`;
  renderPortalList();
}

function filt(list) {
  const q = S.pf.q.trim().toLowerCase();
  return list.filter(k => (!S.pf.mapel || k.mapel === S.pf.mapel) && (!q || (k.judul + ' ' + k.mapel + ' ' + k.deskripsi).toLowerCase().includes(q)));
}
function ytId(u) { const m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/); return m ? m[1] : ''; }
function embedUrl(u) {
  try {
    const x = new URL(u), h = x.hostname.replace(/^www\./, '');
    if (h === 'youtu.be' || h.endsWith('youtube.com')) { const id = ytId(u); if (id) return 'https://www.youtube-nocookie.com/embed/' + id; }

// ── Game internal: Hitung Cepat (60 detik) ──
function hitungCepat(g) {
  const tg = +tingkat(S.user.kelas) || 3; let score = 0, streak = 0, left = 60, cur = null, timer = null;
  const gen = () => {
    const r = n => Math.floor(Math.random() * n) + 1; let a, b, op, ans;
    if (tg <= 2) { a = r(15); b = r(15); if (Math.random() < .5) { op = '+'; ans = a + b; } else { if (b > a) [a, b] = [b, a]; op = '−'; ans = a - b; } }
    else if (tg <= 4) { const t = r(3); if (t === 1) { a = r(80); b = r(60); op = '+'; ans = a + b; } else if (t === 2) { a = r(90) + 10; b = r(a - 1); op = '−'; ans = a - b; } else { a = r(10); b = r(10); op = '×'; ans = a * b; } }
    else { const t = r(4); if (t === 1) { a = r(400) + 50; b = r(300); op = '+'; ans = a + b; } else if (t === 2) { a = r(900) + 100; b = r(a - 1); op = '−'; ans = a - b; } else if (t === 3) { a = r(12); b = r(12); op = '×'; ans = a * b; } else { b = r(12); ans = r(12); a = b * ans; op = '÷'; } }
    return { t: `${a} ${op} ${b}`, ans: ans };
  };
  const draw = () => { cur = gen(); $('#gq').textContent = cur.t + ' = ?'; const i = $('#gin'); i.value = ''; i.focus(); };
  const end = () => {
    clearInterval(timer); const total = score;
    $('#previewBody').innerHTML = `<div class="game-stage"><i class="bi bi-trophy-fill" style="font-size:64px;color:var(--amber)"></i><h2 class="h-lg mt-2">Waktu Habis!</h2><div class="result-score mt-2">${total}</div><p class="muted">poin bintang${S.user.peran === 'siswa' ? ' ditambahkan ke XP-mu' : ''}</p><button class="btn-cb primary lg" id="gAgain"><i class="bi bi-arrow-repeat"></i> Main Lagi</button></div>`;
    $('#gAgain').onclick = () => hitungCepat(g);
    if (S.user.peran === 'siswa' && total > 0) {
      S.d.xp = (S.d.xp || 0) + total; const me = S.d.papan.find(p => p.id === S.user.id); // optimistic
      if (me) me.xp += total; else S.d.papan.push({ id: S.user.id, nama: S.user.nama, kelas: S.user.kelas, xp: total });
      S.d.papan.sort((x, y) => y.xp - x.xp); S.d.papan = S.d.papan.slice(0, 10);
      A('simpanSkorGame', g.id, total).catch(e => toast(e.message, 'warning')); // fire & forget
    }
  };
  $('#mdlPreviewT').textContent = g.judul; $('#previewOpen').hidden = true;
  $('#previewBody').innerHTML = `<div class="game-stage"><div class="game-hud"><span><i class="bi bi-star-fill" style="color:var(--amber)"></i> <span id="gsc">0</span></span><span><i class="bi bi-fire" style="color:var(--orange)"></i> <span id="gst">0</span></span><span><i class="bi bi-stopwatch"></i> <span id="gtm">60</span>s</span></div>
    <div class="game-bar"><i id="gbar" style="width:100%"></i></div><div class="game-q" id="gq" aria-live="polite"></div>
    <label class="visually-hidden-cb" for="gin">Jawabanmu</label><input id="gin" class="form-control game-in" inputmode="numeric" autocomplete="off" placeholder="?"><p class="muted small mt-3 mb-0">Ketik jawaban lalu tekan Enter.</p></div>`;
  $('#gin').addEventListener('keydown', ev => {
    if (ev.key !== 'Enter') return; const v = $('#gin').value.trim(); if (v === '') return;
    const ok = Number(v) === cur.ans; const box = $('#gq');
    if (ok) { streak++; score += 10 + 2 * Math.min(streak, 5); } else { streak = 0; }
    box.classList.remove('flash-ok', 'flash-bad'); void box.offsetWidth; box.classList.add(ok ? 'flash-ok' : 'flash-bad');
    $('#gsc').textContent = score; $('#gst').textContent = streak; draw();
  });
  const el = document.getElementById('mdlPreview'); el.addEventListener('hidden.bs.modal', () => { clearInterval(timer); $('#previewBody').innerHTML = ''; }, { once: true });
  M('mdlPreview').show(); draw();
  timer = setInterval(() => { left--; $('#gtm').textContent = left; $('#gbar').style.width = (left / 60 * 100) + '%'; if (left <= 0) end(); }, 1000);
}

function insights(hasil, kkm) {
  if (!hasil.length) return ['Belum ada hasil ujian masuk. Rekomendasi akan muncul setelah siswa mengumpulkan ujian.'];
  const out = [], rem = hasil.filter(h => h.nilai < kkm), tuntas = hasil.length - rem.length;
  out.push(`${tuntas} dari ${hasil.length} hasil tuntas (${Math.round(tuntas / hasil.length * 100)}%).`);
  if (rem.length) out.push(`${rem.length} hasil di bawah KKM — pertimbangkan jadwal remedial untuk: ${Array.from(new Set(rem.map(h => h.nama))).slice(0, 4).join(', ')}.`);
  const by = {}; hasil.forEach(h => { (by[h.mapel] = by[h.mapel] || []).push(h.nilai); });
  const av = Object.keys(by).map(m => [m, by[m].reduce((a, b) => a + b, 0) / by[m].length]).sort((a, b) => a[1] - b[1]);
  if (av.length > 1) out.push(`Rata-rata terendah: ${av[0][0]} (${num(av[0][1])}); tertinggi: ${av[av.length - 1][0]} (${num(av[av.length - 1][1])}).`);
  return out;
}

  h.forEach(x => { const n = x.nilai; bins[n < kkm ? 3 : n >= 90 ? 0 : n >= 80 ? 1 : 2][2]++; });
  const tot = h.length || 1;
  return bins.map(b => `<div class="dist-row"><div class="lab"><span>${b[0]}</span><span><b>${b[2]} siswa</b> <span class="muted">(${Math.round(b[2] / tot * 100)}%)</span></span></div><div class="dist-bar"><i style="width:${Math.max(b[2] ? 6 : 0, b[2] / tot * 100)}%;background:${b[1]}">${b[2] || ''}</i></div></div>`).join('')
    + `<div class="insight mt-3"><i class="bi bi-stars fs-4" style="color:var(--amber)"></i><div><b>Rekomendasi Tindak Lanjut</b><ul>${insights(h, kkm).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div></div>`;

function gRingkasan() {

    <div class="col-lg-6"><div class="card-cb"><h2 class="h-md mb-3"><i class="bi bi-mortarboard me-2"></i>Kelas & Mata Pelajaran</h2>
    ${['Kelas', 'Mapel'].map(t => `<div class="d-flex justify-content-between align-items-center mt-3 mb-2"><b>${t === 'Kelas' ? 'Daftar Kelas' : 'Mata Pelajaran'}</b><button class="btn-cb soft sm" data-act="g-km-new" data-t="${t}"><i class="bi bi-plus-lg"></i> Tambah</button></div>
      <div class="d-flex gap-2 flex-wrap">${km.filter(x => x.tipe === t).map(x => `<span class="badge-pill blue" style="padding:6px 8px 6px 12px;font-size:13px">${esc(x.nama)} <button class="icon-act del" style="width:24px;height:24px;border-radius:50%" data-act="g-km-del" data-id="${esc(x.id)}" aria-label="Hapus ${esc(x.nama)}"><i class="bi bi-x"></i></button></span>`).join('') || '<span class="muted small">Belum ada.</span>'}</div>`).join('')}</div></div></div>
    <div class="card-cb mt-4"><h2 class="h-md mb-3"><i class="bi bi-clock-history me-2"></i>Log Aktivitas Terbaru</h2><div class="table-wrap">${(S.d.log || []).length ? `<table class="table-cb"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Peran</th><th>Aktivitas</th></tr></thead><tbody>${S.d.log.slice(0, 40).map(l => `<tr><td class="small">${esc(fmtDT(l.Waktu))}</td><td>${esc(l.Pengguna)}</td><td><span class="badge-pill">${esc(l.Peran)}</span></td><td>${esc(l.Aktivitas)}</td></tr>`).join('')}</tbody></table>` : empty('clock-history', 'Belum ada log.')}</div></div>`;
}

// ── Aksi panel guru ──
const byId = (arr, id, key) => arr.find(x => x[key || 'ID'] === id);
Object.assign(ACT, {
  gtab: el => { S.gTab = el.dataset.v; renderGTab(); },
  ktab: el => { S.kTab = el.dataset.v; gKonten(); },
  utab: el => { S.uTab = el.dataset.v; S.pengguna.page = 1; gPengguna(); },
  pg: el => { const st = { rekap: S.rekap, bank: S.bank, user: S.pengguna }[el.dataset.k]; st.page = +el.dataset.p; RR[el.dataset.k](); },
  'g-copy': el => copyText(el.dataset.t),
  'g-export-xlsx': exportXlsx, 'g-export-pdf': exportPdf,
  'g-soal-new': () => formSoal(), 'g-soal-edit': el => formSoal(el.dataset.id), 'g-soal-import': formImportSoal,
  'g-soal-del': el => confirmDlg('Hapus soal ini dari bank soal?', async () => {
    const id = el.dataset.id, keep = S.d.soal.slice(); S.d.soal = S.d.soal.filter(x => x.ID !== id); if (S.gTab === 'bank') bankTable(); // optimistis
    try { await A('hapusSoal', id); toast('Soal dihapus.'); } catch (e) { S.d.soal = keep; renderGTab(); toast(e.message, 'danger'); }
  }, 'Hapus'),
  'g-jadwal-new': () => formJadwal(), 'g-jadwal-edit': el => formJadwal(el.dataset.id),
  'g-jadwal-del': el => confirmDlg('Hapus jadwal ujian ini? Ujian yang sudah dikerjakan siswa tidak dapat dihapus.', async () => {
    try { await A('hapusJadwal', el.dataset.id); S.d.jadwal = S.d.jadwal.filter(x => x.ID !== el.dataset.id); renderGTab(); toast('Jadwal dihapus.'); } catch (e) { toast(e.message, 'danger'); }
  }, 'Hapus'),
  'g-gen-token': () => { const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let t = ''; for (let i = 0; i < 6; i++) t += abc[Math.floor(Math.random() * abc.length)]; $('#jToken').value = t; },
  'g-pick-all': () => { $$('#jPick input').forEach(i => { i.checked = true; JF.sel.add(i.value); }); $('#jCount').textContent = JF.sel.size + ' soal dipilih'; },
  'g-pick-none': () => { JF.sel.clear(); $$('#jPick input').forEach(i => { i.checked = false; }); $('#jCount').textContent = '0 soal dipilih'; },
  'g-token-reset': async el => {
    try { const t = await A('resetToken', el.dataset.id), j = byId(S.d.jadwal, el.dataset.id); if (j) j.Token = t; renderGTab(); toast('Token baru: ' + t, 'info'); } catch (e) { toast(e.message, 'danger'); }
  },
  'g-sesi-tutup': el => confirmDlg('Tutup sesi ujian ini sekarang? Siswa yang masih mengerjakan akan dinilai otomatis dari jawaban terakhir.', async () => {
    try { S.d.pantau = await A('tutupSesi', el.dataset.id); const j = byId(S.d.jadwal, el.dataset.id); if (j) j.Status = 'Ditutup'; await refresh(); toast('Sesi ujian ditutup.'); } catch (e) { toast(e.message, 'danger'); }
  }, 'Tutup Sesi'),
  'g-pantau': async () => { try { S.d.pantau = await A('getPantau'); const el = $('#gLive'); if (el) el.innerHTML = liveHtml(); toast('Data pemantauan diperbarui.', 'info'); } catch (e) { toast(e.message, 'danger'); } },
  'g-konten-new': () => formKonten(), 'g-konten-edit': el => formKonten(el.dataset.id),
  'g-konten-view': el => { const t = S.kTab; if (t === 'Game') openGame(el.dataset.id); else openMedia(KMAP[t], el.dataset.id); },
  'g-konten-del': el => confirmDlg('Hapus ' + S.kTab.toLowerCase() + ' ini?', async () => {
    const t = S.kTab, id = el.dataset.id, keep = S.d[KMAP[t]].slice(); S.d[KMAP[t]] = keep.filter(x => x.id !== id); gKonten();
    try { await A('hapusKonten', t, id); toast('Dihapus.'); } catch (e) { S.d[KMAP[t]] = keep; gKonten(); toast(e.message, 'danger'); }
  }, 'Hapus'),
  'g-user-new': () => formUser(), 'g-user-edit': el => formUser(el.dataset.id), 'g-user-import': formImportUser, 'g-user-tpl': userTemplate,
  'g-user-del': el => confirmDlg('Hapus pengguna ini secara permanen?', async () => {
    try { await A('hapusUser', el.dataset.id); S.d.users = S.d.users.filter(x => x.id !== el.dataset.id); userTable(); toast('Pengguna dihapus.'); } catch (e) { toast(e.message, 'danger'); }
  }, 'Hapus'),
  'g-km-new': el => { const t = el.dataset.t; dyn('Tambah ' + (t === 'Kelas' ? 'Kelas' : 'Mata Pelajaran'), `<label class="form-label req" for="kmNama">Nama</label><input id="kmNama" class="form-control" maxlength="60" placeholder="${t === 'Kelas' ? 'Contoh: 4-B (gunakan huruf, bukan angka)' : 'Contoh: Seni Budaya'}">`, async () => {
    const n = $('#kmNama').value.trim(); if (!n) throw new Error('Nama wajib diisi.');
    const r = await A('simpanKM', { Tipe: t, Nama: n, Kelas: t === 'Kelas' ? tingkat(n) : '' }); S.d.kelasMapel.push(r); gPengaturan(); toast('Ditambahkan.'); }); },
  'g-km-del': el => confirmDlg('Hapus data ini dari daftar?', async () => {
    try { await A('hapusKM', el.dataset.id); S.d.kelasMapel = S.d.kelasMapel.filter(x => x.id !== el.dataset.id); gPengaturan(); } catch (e) { toast(e.message, 'danger'); }
  }, 'Hapus'),
  'g-cfg-save': async el => {
    busy(el, true, 'Menyimpan...');
    try { S.d.cfg = await A('simpanConfig', { namaSekolah: $('#cNama').value, tahunAjaran: $('#cTA').value, semester: $('#cSem').value, kkm: $('#cKkm').value, tampilNilai: $('#cTampil').value, logoUrl: $('#cLogo').value }); applyConfig(); toast('Pengaturan disimpan.'); }
    catch (e) { toast(e.message, 'danger'); } finally { busy(el, false); }
  }
});
</script>
